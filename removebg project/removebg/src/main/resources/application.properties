# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/removebgdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update

# Disable default Spring Security user configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==========================================
# Clerk Authentication Configuration
# ==========================================
clerk.issuer=${CLERK_ISSUER}
clerk.jwks-url=${CLERK_JWKS_URL}

# ==========================================
# Clerk Webhook Configuration
# ==========================================
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET}

# ==========================================
# Clipdrop API Configuration
# ==========================================
clipdrop.apikey=${CLIPDROP_API_KEY}

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# SQL Logging
# Use for local development only
# ==========================================
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
